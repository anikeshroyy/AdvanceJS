<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Circumference of a Circle</h1>
    <label for="">Enter the value of radius</label>
    <input type="text" id="inputRadius">
    <button id="submitBtn">Submit</button>
<h3 id="result">this is the result</h3>
    <script>
        const PI = 3.14;
        let radius;
        let circumference;

        document.getElementById("submitBtn").onclick = function () {
            radius = document.getElementById("inputRadius").value;
            radius = Number(radius);
            console.log(circumference = 2 * PI * radius);
            document.getElementById("result").textContent = `circumference is ${circumference}`;
        }
    </script>
</body>

</html>
