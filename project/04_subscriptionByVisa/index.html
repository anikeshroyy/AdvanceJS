<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Subscribe to get latest news!</h1>

        <input type="checkbox" id="myChckBox">
        <label for="myChckBox">Subscribe</label>

        <input type="radio" id="visaBtn" name="paymentMethod">
        <label for="visaBtn">Visa</label>

        <input type="radio" id="creditCardBtn" name="paymentMethod">
        <label for="creditCardBtn">Credit Card</label>

        <input type="radio" id="payPalBtn" name="paymentMethod">
        <label for="payPalBtn">Pay Pal</label>

        <button id="subBtn">Subscribe</button>

        <h3 id="subResult">Check Subscription</h3>
        <h3 id="paymentResult">Payment Method</h3>
    </div>


    <script src="./index.js"></script>
</body>

</html>
