<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="main-container">
        <h1>Number Guessing Game</h1>
        <!-- <label for="userInput">Number</label> -->
        <input type="text" id="userInput" placeholder="Enter The Number">
        <button id="guessBtn">Guess</button>
        <button id="resetBtn">Reset</button>

        <p id="errMsg" style="margin: 10px 0px; color: red;"></p>
        <p id="displayResult" style="margin: 10px 0px;"></p>
        <p id="totalAttempts" style="display: none; color: yellow;"></p>
    </div>

    <script src="./index.js"></script>
</body>

</html>
