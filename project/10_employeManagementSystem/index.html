<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employe Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Employe Management System</h1>
        <div class="input-container">
            <label for="employeName">Employe Name <span>*</span></label>
            <input type="text" id="employeeName" placeholder="Enter the name of employee">
            <label for="employeeDepartment">Employe Department <span>*</span></label>
            <select name="" id="employeeDepartment">
                <option value="Labour">Labour</option>
                <option value="It">Information technology</option>
                <option value="Manager">Manager</option>
            </select>
            <label for="employeeSalary">Employe Salary <span>*</span></label>
            <input type="text" id="employeeSalary" placeholder="Enter the salary of employee">
        </div>
        <button id="addEmployeeBtn">Add Employee</button>
        <button id="resetInputBtn">Reset Form</button>
        <hr>

        <h1>Search</h1>
        <label for="">Search Employee</label>
        <br>
        <input type="text" id="srchemp" placeholder="Enter Employe Name">
        <button id="srchBtn">Search</button>
        <br>

        <h1>Filter</h1>
        <label for="filterEmp">Filter Employee by Department</label>
        <br>
        <select name="" id="filterEmp">
            <option value="All">All</option>
            <option value="Labour">Labour</option>
            <option value="It">Information technology</option>
            <option value="Manager">Manager</option>
        </select>
        <button id="filterBtn">Filter</button>
        <br>

        <h1>Sort</h1>
        <label for="sortEmpBySalary">Sort Employee by Salary</label>
        <br>
        <select name="" id="sortEmpBySalary">
            <option value="hTl">Highest to Lowest</option>
            <option value="lTh">Lowest to Highest</option>
        </select>
        <button id="salarySortBtn">Sort</button>
        <br>

        <label for="sortEmpByName">Sort Employee by Name</label>
        <br>
        <select name="" id="sortEmpByName">
            <option value="aTz">A to Z</option>
            <option value="zTa">Z to A</option>
        </select>
        <button id="nameSortBtn">Sort</button>
    </div>

    <div class="employe-data-container">
        <h2>Employee History</h2>
        <ul id="employeeData"></ul>
    </div>

    <div class="action-container">
        <h2>Take Action</h2>
        <button id="deletAllEmployee">Delete All Employee</button>

        <hr>
        <div class="statics">
            <h2>Statics</h2>
            <p id="totalEmploye">Total Employe : 0</p>
            <p id="highestSalary">Highest Salary : 0</p>
            <p id="lowestSalary">Lowest Salary : 0</p>
            <p id="averageSalary">Average Salary : 0</p>
            <p id="totalSalary">Total Salary : 0</p>
        </div>
    </div>

    <script src="./index.js"></script>
</body>

</html>
