<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/f1ad598525.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=Yuyu&display=swap');
    </style>
</head>

<body>
    <div class="container">
        <section id="nav-section">
            <i class="fa-solid fa-sun theme-icon" id="themeIcon"></i>
            <!-- <i class="fa-solid fa-sun theme-icon" id="themeIcon"></i> -->
            <div class="group">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
                    <g>
                        <path
                            d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                        </path>
                    </g>
                </svg>

                <input id="cityQuery" class="input" type="search" placeholder="Search Your Favourite City..."
                    name="searchbar" />

                <button id="srchBtn">Search</button>
            </div>
            <button id="currentLocation"><i class="fa-solid fa-location-crosshairs"></i> Current Location</button>
        </section>

        <section id="header-section">
            <h1>Weather Dashboard</h1>
            <p>Check real-time weather conditions and a 5-day forecast for any city.</p>
        </section>

        <section id="weather-section">
            <div class="city-card">
                <p id="city"></p>
                <h1 id="time"></h1>
                <p id="date"></p>
            </div>
            <div class="weather-card">
                <div class="temp-section">
                    <div class="temp-container">
                        <h1 id="temp">City Name</h1>
                        <p id="feelsLike">Feels like</p>
                    </div>
                    <div class="daylight-section">
                        <div class="sunrise">
                            <div class="sunrise-icon">
                                <img src="./sunrise.png" alt="" class="sunrise-icon">
                            </div>
                            <div class="sunrise-content">
                                <p>Sunrise</p>
                                <p id="sunrise">8:37Am</p>
                            </div>
                        </div>
                        <div class="sunset">
                            <div class="sunset-icon">
                                <img src="./sunset.png" alt="" class="sunset-icon">
                            </div>
                            <div class="sunset-content">
                                <p>Sunset</p>
                                <p id="sunset">6:10 Pm</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="temp-icon-section">
                    <img id="sun-img" alt="">
                    <p style="text-align: center;" id="weatherType">Sunny</p>
                </div>
                <div class="weather-highlights">
                    <div class="weather-metric-container">
                        <div class="weather-metric">
                            <img src="./humidity.png" alt="" class="hpus-icon">
                            <p id="humidity"></p>
                            <p>Humidity</p>
                        </div>
                        <div class="weather-metric">
                            <img src="./barometer.png" alt="" class="hpus-icon">
                            <p id="pressure"></p>
                            <p>Pressure</p>
                        </div>
                    </div>
                    <div class="weather-metric-container">
                        <div class="weather-metric">
                            <img src="./wind.png" alt="" class="hpus-icon">
                            <p id="speed"></p>
                            <p>Wind Speed</p>
                        </div>
                        <div class="weather-metric">
                            <img src="./protection.png" alt="" class="hpus-icon">
                            <p id="visibility"></p>
                            <p>Visibility</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="hourly-forcast-section">
            <div class="hourly-forcast-container">
                <h2>Hourly Forcast</h2>
                <div class="hourly-forcast" id="hourlyForecast">

                </div>
            </div>

            <div class="daily-forcatst-container">
                <h2>5 Days Forcast</h2>
                <div class="daily-forcast" id="dailyForecast">

                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>Designed By Anikesh Roy</p>
    </footer>

    <script src="./index.js"></script>
</body>

</html>
